name: Update Engineering Activity Dashboard

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate engineering dashboard and daily journal entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python dashboard/dashboard.py

      - name: Commit and push dashboard to main
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add README.md dashboard/activity-log.md
          if git diff --cached --quiet; then
            echo "Dashboard is already up to date."
          else
            git commit -m "chore: update profile dashboard"
            git push origin HEAD:main
          fi

      - name: Sync journal to activity collection repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ACTIVITY_TOKEN: ${{ secrets.REPO_ACTIVITY_TOKEN }}
        run: python dashboard/dashboard.py --sync-collection-repos-only